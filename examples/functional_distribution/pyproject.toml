[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "synthetic-distribution-example"
version = "1.2.3"
description = "Trusted synthetic application metadata fixture."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.14"
dependencies = ["nbformat>=5.10,<6"]

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[project.scripts]
distribution-example = "distribution_ml.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/distribution_ml"]
dev-mode-dirs = ["src"]

[tool.fixture]
purpose = "Preserve every original metadata field and backend setting."
