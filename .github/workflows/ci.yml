name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  UV_VERSION: "0.12.5"

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync locked environment
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Build distributions
        run: uv build

  tests:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync locked environment
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Run deterministic tests
        if: matrix.python-version != '3.12'
        run: uv run --python ${{ matrix.python-version }} pytest -m "not integration and not end_to_end and not external and not llm"

      - name: Run the complete test suite on the primary Python version
        if: matrix.python-version == '3.12'
        run: uv run --python ${{ matrix.python-version }} pytest
