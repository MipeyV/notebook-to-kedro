name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  UV_VERSION: "0.12.5"

jobs:
  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install locked engine dependencies
        run: uv sync --locked --no-default-groups --python 3.12

      - name: Install locked extension tools
        working-directory: extensions/vscode
        run: npm ci --no-audit --no-fund

      - name: Check extension formatting
        working-directory: extensions/vscode
        run: npm run format:check

      - name: Compile and test protocol
        working-directory: extensions/vscode
        run: npm test

      - name: Test actual VS Code commands
        working-directory: extensions/vscode
        env:
          NTK_TEST_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: xvfb-run -a npm run test:host

      - name: Package VSIX
        working-directory: extensions/vscode
        run: npm run package

      - name: Preserve installable extension
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notebook-to-kedro-vscode
          path: generated/notebook-to-kedro-*.vsix
          if-no-files-found: error

  generated-bootstrap:
    name: Generated project bootstrap on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install only locked engine dependencies
        run: uv sync --locked --no-default-groups --python ${{ matrix.python-version }}

      - name: Build, install and verify six trusted generated variants
        run: >-
          uv run --no-default-groups --python ${{ matrix.python-version }}
          python tools/check_generated_bootstrap.py generated/bootstrap

      - name: Preserve bootstrap logs and runtime evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-bootstrap-python-${{ matrix.python-version }}
          path: |
            generated/bootstrap/*/*.log
            generated/bootstrap/*/runtime.json
            generated/bootstrap/*/evidence.json
            generated/bootstrap/*/pytest.xml
            generated/bootstrap/*/observed-cli.json
            generated/bootstrap/*/negative-control.json
          if-no-files-found: warn
          retention-days: 14

  financial-journey:
    name: Financial model user journeys
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install Python and matching locked reference runtime
        run: uv sync --locked --python 3.12

      - name: Verify both financial models under both naming profiles
        run: uv run --python 3.12 python tools/check_financial_journey.py generated/financial-journey

      - name: Preserve journey and timing evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: financial-model-journeys
          path: |
            generated/financial-journey/journey-summary.json
            generated/financial-journey/*/evidence.json
            generated/financial-journey/*/runtime.json
            generated/financial-journey/*/01-inspect.json
            generated/financial-journey/*/02-plan.json
            generated/financial-journey/*/03-generate.json
            generated/financial-journey/*/JOURNEY.md
            generated/financial-journey/*/*.log
            generated/financial-journey/*/*.xml
            generated/financial-journey/*/capture/*
            generated/financial-journey/*/runtime-constraints.txt
            generated/financial-journey/*/workspace/project-journey.json
            generated/financial-journey/*/workspace/regression-model.json
            generated/financial-journey/*/workspace/model-probe.csv
            generated/financial-journey/*/workspace/model-probe-reference.json
            generated/financial-journey/*/attempts/*/*.json
            generated/financial-journey/*/effort-comparison/*
          if-no-files-found: warn
          retention-days: 14

  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync locked environment
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Build distributions
        run: uv build

  tests:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync locked environment
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Run deterministic tests
        if: matrix.python-version != '3.12'
        run: uv run --python ${{ matrix.python-version }} pytest -m "not integration and not end_to_end and not external and not llm"

      - name: Run the complete test suite on the primary Python version
        if: matrix.python-version == '3.12'
        run: uv run --python ${{ matrix.python-version }} pytest
